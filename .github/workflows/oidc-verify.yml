name: OIDC Smoke Verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify_oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::994899741408:role/GitHubActions-NexusTools-Releases
          aws-region: us-east-2

      - name: Verify S3 upload, CloudFront invalidation, and least-privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"
          test -n "${AWS_SESSION_TOKEN:-}"
          aws sts get-caller-identity

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          KEY="releases/_oidc-healthcheck/${REPO_NAME}-ok.txt"
          printf 'oidc-ok %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/oidc-ok.txt

          echo "1. Testing allowed s3:PutObject to releases/* ..."
          aws s3 cp /tmp/oidc-ok.txt "s3://nexustools-website-static/${KEY}" --region us-east-2

          echo "2. Testing allowed cloudfront:ListDistributions ..."
          DIST_ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Id=='E2Q1NJKAR65EQA'].Id" --output text)"
          test "${DIST_ID}" = "E2Q1NJKAR65EQA"

          echo "3. Testing allowed cloudfront:CreateInvalidation on E2Q1NJKAR65EQA ..."
          aws cloudfront create-invalidation --distribution-id E2Q1NJKAR65EQA --paths "/releases/_oidc-healthcheck/*"

          echo "4. Testing denied s3:GetObject on website root index.html ..."
          if aws s3 cp s3://nexustools-website-static/index.html /tmp/index.html --region us-east-2 2>/dev/null; then
            echo "ERROR: Reading root index.html should have been denied!" >&2
            exit 1
          fi

          echo "5. Testing denied s3:DeleteObject on releases/* ..."
          if aws s3 rm "s3://nexustools-website-static/${KEY}" --region us-east-2 2>/dev/null; then
            echo "ERROR: Deleting release objects should have been denied!" >&2
            exit 1
          fi

          echo "ALL OIDC CHECKS PASSED!"
